name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Check stable signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.WRITEASSIST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WRITEASSIST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WRITEASSIST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WRITEASSIST_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Stable release signing secrets are configured."
          else
            echo "::warning::Stable signing not configured. Debug APKs may require uninstall; configure four WRITEASSIST_* repository secrets before distributing an updateable build."
          fi
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: writeassist-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
